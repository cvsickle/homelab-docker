services:
  filebrowser-q:
    image: ghcr.io/gtsteffaniak/filebrowser:2-stable
    container_name: filebrowser-q
    user: "1000:10000"
    environment:
      FILEBROWSER_CONFIG: /home/filebrowser/data/config.yaml
    ports:
      - 8900:80
    volumes:
      - /home/corey/docker/filebrowser-q:/home/filebrowser/data
      - /mnt/files:/files
    labels:
      - "autoheal=true"
      - "com.centurylinklabs.watchtower.scope=true"
    restart: unless-stopped
